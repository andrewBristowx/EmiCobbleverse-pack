plugins {
    id 'fabric-loom' version '1.10.5'
}

version = project.mod_version
group = 'emi.ajustes'
base { archivesName = 'emi-ajustes' }

// Alexandria solo se usa para compilar (el mixin lo nombra; en el servidor ya esta instalado). Ruta: variable de entorno ALEXANDRIA_JAR (ver build.sh).
def alexandriaJar = System.getenv('ALEXANDRIA_JAR')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    if (alexandriaJar) compileOnly files(alexandriaJar)
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
